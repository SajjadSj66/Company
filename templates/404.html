{% load static %}
{% load jformat %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
  <title>404</title>
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    * {
      font-family: Vazir !important;
    }



    .child {
      display: flex;
      position: relative;
      top: 154px;
      justify-self: center;
      max-width: 100%;
      height: auto;
    }

    a {
      text-decoration: none !important;
      color: inherit;
    }

    /* Vazir - Medium */
    @font-face {
      font-family: 'Vazir';
      src: url('{% static "/font/Vazir-Medium.woff2" %}') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    /* Vazir - Bold */
    @font-face {
      font-family: 'Vazir';
      src: url('{% static "/font/Vazir-Bold.woff2" %}') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* Vazir - thin */
    @font-face {
      font-family: 'Vazir';
      src: url('{% static "/font/Vazir-Thin.woff2" %}') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
  </style>

</head>


<body>

  <!-- navbar -->
  {% include "includes/navbar.html" %}


  <div class="div">

    <img class="child" src="{% static 'asets/Frame 119.png' %}" alt="404">

  </div>

</body>

</html>
